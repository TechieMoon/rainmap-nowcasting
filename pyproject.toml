[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rainmap-nowcasting"
version = "0.1.0"
description = "Deep learning-based precipitation nowcasting from sequential rain map images."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [
  { name = "TechieMoon" }
]
dependencies = [
  "aiohttp>=3.9",
  "fsspec>=2023.5",
  "h5py>=3.10",
  "huggingface-hub>=0.24",
  "numpy>=1.24",
  "pillow>=10.0",
  "pyyaml>=6.0",
  "safetensors>=0.4",
  "torch>=2.2"
]

[project.optional-dependencies]
gui = ["PySide6>=6.7"]
dev = ["pytest>=8.0"]
build = ["pyinstaller>=6.0"]
all = ["PySide6>=6.7", "pytest>=8.0", "pyinstaller>=6.0"]

[project.scripts]
rainmap-client = "rainmap_nowcasting.client:main"
rainmap-benchmark = "rainmap_nowcasting.benchmark:main"
rainmap-evaluate = "rainmap_nowcasting.evaluate:main"
rainmap-predict = "rainmap_nowcasting.predict:main"
rainmap-prepare-sevir = "rainmap_nowcasting.prepare_sevir:main"
rainmap-train = "rainmap_nowcasting.train:main"
rainmap-synthetic = "rainmap_nowcasting.synthetic:main"
rainmap-upload-hf = "rainmap_nowcasting.upload_hf:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
